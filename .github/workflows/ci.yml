name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────
  # 1. Node.js Backend — Lint + Test
  # ──────────────────────────────────────────────────────────────
  node-backend:
    name: Node.js Backend (lint + test)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: chatai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chatai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:ci_test_password@localhost:5432/chatai_test
      VAULT_ENCRYPTION_KEY: ci_test_vault_key_32_bytes_minimum_length_padding
      INTERNAL_SERVICE_SECRET: ci_test_internal_secret_64_chars_padded_for_testing_only
      SUPABASE_URL: http://localhost:8000
      SUPABASE_SERVICE_ROLE_KEY: ci_placeholder_service_role_key
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: chatai-backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: chatai-backend

      - name: Run tests
        run: npm test
        working-directory: chatai-backend

  # ──────────────────────────────────────────────────────────────
  # 2. Go Agent Runtime — Build + Test
  # ──────────────────────────────────────────────────────────────
  go-runtime:
    name: Go Agent Runtime (build + test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agent-runtime/go.mod
          cache: true

      - name: Build
        run: go build ./...
        working-directory: agent-runtime

      - name: Run tests
        run: go test ./... -v -race -timeout 120s
        working-directory: agent-runtime

  # ──────────────────────────────────────────────────────────────
  # 3. Python Agent Brain — Lint + Test
  # ──────────────────────────────────────────────────────────────
  python-brain:
    name: Python Agent Brain (lint + test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: agent-brain/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: agent-brain

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
        working-directory: agent-brain
        env:
          INTERNAL_SERVICE_SECRET: ci_test_internal_secret
          OPENAI_API_KEY: sk-placeholder-ci-key

  # ──────────────────────────────────────────────────────────────
  # 4. Frontend — Type-check + Build
  # ──────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (type-check + build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Type-check
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000

  # ──────────────────────────────────────────────────────────────
  # 5. Docker Compose Smoke Test
  # Only runs on PRs to main and pushes to main (not on develop)
  # ──────────────────────────────────────────────────────────────
  docker-smoke:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    needs: [node-backend, go-runtime, python-brain, frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write test .env
        run: |
          cat > .env << 'EOF'
          DB_PASSWORD=ci_smoke_password
          VAULT_ENCRYPTION_KEY=ci_smoke_vault_key_32_bytes_minimum_padding
          INTERNAL_SERVICE_SECRET=ci_smoke_internal_secret_64_chars_padding_for_test
          SUPABASE_URL=http://localhost:8000
          SUPABASE_SERVICE_ROLE_KEY=ci_placeholder_key
          EOF

      - name: Build and start services
        run: docker compose up -d --build
        timeout-minutes: 10

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for services..."
          timeout 120 bash -c 'until docker compose ps | grep -E "healthy" | wc -l | grep -q "4"; do sleep 5; done'

      - name: Check Node.js backend health
        run: curl -f http://localhost:5000/health

      - name: Check Go runtime health
        run: curl -f http://localhost:8081/health

      - name: Check Python brain health
        run: curl -f http://localhost:8082/health

      - name: Print logs on failure
        if: failure()
        run: docker compose logs --tail=100

      - name: Tear down
        if: always()
        run: docker compose down -v
