<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Tile background: machined panel surface -->
  <rect x="2" y="2" width="60" height="60" rx="13" fill="#1C2229"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="12.25" fill="none" stroke="#3A4554" stroke-width="1"/>

  <!-- Faceted bolt mark, two flat tones (no gradient) to read as milled/beveled -->
  <path d="M35 12 L20 34 L29 34 L26 52 L45 28 L35 28 Z" fill="#0284C7"/>
  <path d="M35 12 L29.5 34 L35 34 L26 52 L35 28 L35 28 Z" fill="#38BDF8" opacity="0.55"/>

  <!-- Hairline edge on the bolt for the machined-edge detail -->
  <path d="M35 12 L20 34 L29 34 L26 52 L45 28 L35 28 Z" fill="none" stroke="#0A0F14" stroke-width="0.75" stroke-linejoin="round"/>
</svg>
