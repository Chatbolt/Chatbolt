<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Chatbolt Companion</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 360px;
      min-height: 480px;
      max-height: 560px;
      background-color: #09090b;
      color: #ededed;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      padding: 12px 16px;
      background: #121216;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .avatar {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    .assistant-info h3 {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-pill {
      font-size: 10px;
      color: #10b981;
      display: flex;
      align-items: center;
      gap: 4px;
      font-weight: 600;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #10b981;
      box-shadow: 0 0 6px #10b981;
    }
    .free-badge {
      font-size: 9px;
      text-transform: uppercase;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 9999px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .quick-actions {
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      gap: 6px;
      overflow-x: auto;
    }
    .action-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #d1d5db;
      font-size: 10px;
      font-weight: 600;
      padding: 5px 8px;
      border-radius: 6px;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s;
    }
    .action-btn:hover {
      background: rgba(99, 102, 241, 0.2);
      border-color: #6366f1;
      color: #fff;
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 280px;
    }
    .msg {
      max-width: 88%;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 12px;
      line-height: 1.4;
      word-break: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: #4f46e5;
      color: #fff;
      border-bottom-right-radius: 2px;
    }
    .msg.assistant {
      align-self: flex-start;
      background: #18181b;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #e4e4e7;
      border-bottom-left-radius: 2px;
    }
    .msg .meta {
      font-size: 9px;
      color: #9ca3af;
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .input-bar {
      padding: 10px 12px;
      background: #121216;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      gap: 8px;
    }
    .input-bar input {
      flex: 1;
      background: #1c1c21;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 8px 12px;
      color: #fff;
      font-size: 12px;
      outline: none;
    }
    .input-bar input:focus {
      border-color: #6366f1;
    }
    .send-btn {
      background: #6366f1;
      border: none;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 0 12px;
      border-radius: 8px;
      cursor: pointer;
    }
    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="avatar">✨</div>
      <div class="assistant-info">
        <h3 id="agent-name">Aria</h3>
        <div class="status-pill">
          <span class="status-dot"></span>
          <span>Companion Active</span>
        </div>
      </div>
    </div>
    <span class="free-badge">BYOK Free</span>
  </header>

  <div class="quick-actions">
    <button class="action-btn" id="btn-summarize">📄 Summarize Page</button>
    <button class="action-btn" id="btn-tasks">✅ Extract Tasks</button>
    <button class="action-btn" id="btn-explain">💡 Explain Page</button>
  </div>

  <div class="chat-messages" id="messages-container">
    <div class="msg assistant">
      <div>Hi! I'm your continuous personal assistant. Ask me anything, or summarize this browser tab in 1 click.</div>
      <div class="meta">Aria • Just now</div>
    </div>
  </div>

  <div class="input-bar">
    <input type="text" id="chat-input" placeholder="Ask your assistant anything..." />
    <button class="send-btn" id="send-btn">Send</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
